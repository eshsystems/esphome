# Boti szoba fali panel – Guition ESP32-S3-4848S040 (480x480, 3 relé)
# Oldalak: Lámpa | Zene (indítás/leállítás + 4 stílus) | Listák (MA kedvenc lejátszási listák)
#          | Időzítő (5/10/15 perc, a végén csipog)
#          | Játék (párkereső, Simon mondja, amőba 1/2 fő, vakondos – hanggal)
#          | Zsebpénz (csillag ikon: a gyerekek gyűjtése csillagokkal, mint a HA-s kártyán)
# Gyerekzár (HA-kapcsoló): bekapcsolva csak a Lámpa és a Spot oldal érhető el.
# Éjszakai mód (HA-kapcsoló): sötét kijelző; érintésre felkapcsol, 10 mp után újra elsötétül.
# Webes felület: http://<panel IP-címe>/
# Követelmény: ESPHome 2025.10+ (HA-akció válaszának fogadása a listákhoz).
# Az összes boti_szoba_panel_* fájlnak (.h és .png) ezzel a YAML-lel egy mappában kell lennie.
# A HA-ban az ESPHome integrációnál engedélyezd az eszköznek a
# „Home Assistant akciók végrehajtása” opciót, különben a zene nem megy.

substitutions:
  name: boti-szoba-panel
  friendly_name: Boti szoba panel
  # Music Assistant lejátszó, amin a zene szól (MA-s media_player entitás!)
  # Egyelőre a konyhai hangszóró; ha lesz Boti szobában lejátszó, csak ezt kell átírni
  ma_player: media_player.konyha_hangszoro
  # Music Assistant integráció config entry ID-ja (HA-ból kiolvasva)
  ma_config_entry: 01JKCX1WYVC962F5123D0GSEM5
  spot_light: light.botiszoba_spot
  # A 4 stílusgomb: felirat + Music Assistant lejátszási lista neve vagy URI-ja
  style1_label: Mesék        # Magyar Mesék És Hangjátékok Gyerekeknek
  style1_media: spotify--SAqMwi7M://playlist/4GeT6cLv6gutagcMwDa4lG
  style2_label: Gyerekdalok  # Vidám gyerekdalok
  style2_media: spotify--SAqMwi7M://playlist/3icy9Wvqgv4fybUFU28qqC
  style3_label: Altató       # Magyar altatók
  style3_media: spotify--SAqMwi7M://playlist/35e5754OovKtVL787BQeHl
  style4_label: Buli         # Bulis gyerekdalok
  style4_media: spotify--SAqMwi7M://playlist/3z5RGCaAali30mrrraDwpY
  # Zsebpénz oldal: gyerekenként név, a cél neve, a gyűjtött összeg és a cél ára (HA-entitások)
  kid1_name: Botond
  kid1_goal: Lego
  kid1_saved: sensor.penzgyujtes_botond_zsebpenz
  kid1_target: input_number.botond_valasztott_targy_ara
  kid2_name: Marcell
  kid2_goal: Lego
  kid2_saved: sensor.penzgyujtes_marcell_zsebpenz
  kid2_target: input_number.marcell_valasztott_targy_ara

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.10.0
  includes:
    - boti_szoba_panel_games.h
    - boti_szoba_panel_spot.h
    - boti_szoba_panel_savings.h
  on_boot:
    priority: -100
    then:
      - script.execute: apply_lock
      - script.execute: apply_night
      # A játékok hangjai a buzzeren
      - lambda: |-
          boti_games::sound = [](int count, int on_ms, int off_ms) {
            id(beep).execute(count, on_ms, off_ms);
          };

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    # Csíkozódás/elcsúszó kép ellen: a kijelző képe a PSRAM-ban van, és ha a memóriabusz
    # túl lassú vagy a flash-írás idejére letiltódik a cache, a kép egy-két kockára elcsúszik.
    advanced:
      # A program is a PSRAM-ból fut, így flash-írás közben sem áll le a kijelző frissítése
      execute_from_psram: true
    sdkconfig_options:
      # Nagyobb adatcache és 64 bájtos cache-sor: gyorsabb PSRAM-olvasás a kijelzőnek
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # A kijelző megszakítása IRAM-ból fut, flash-műveletek alatt is
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: y

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret boti_panel_api_key

# Bluetooth proxy: KIKAPCSOLVA. Bekapcsolva a panel leszakadt a Wi-Fi-ről, és a
# HA-akciók (spot, listák) sem futottak le: a kijelző + BLE + Wi-Fi együtt túl sok.
# esp32_ble_tracker:
#   scan_parameters:
#     active: true
#
# bluetooth_proxy:
#   active: true

# Böngészőből elérhető felület az IP-címen (a JS a panelről töltődik, net nélkül is megy)
web_server:
  port: 80
  version: 3
  local: true

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin: # OTA alatt ne villogjon a kijelző
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------------------------------------------------------------- Relék
# A lámpa helyben kapcsol: HA vagy Wi-Fi nélkül is működik.
# GPIO40 (H1 bal 2. sor) → Sonoff T1EU relé1 vezérlőbemenete.
output:
  - platform: gpio
    id: relay1_out
    pin:
      number: GPIO40
      # Aktív HIGH – a panelen ellenőrizve (2026-10-25: HA „be” = a lámpa világít)
      inverted: false
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

switch:
  # GPIO2 (H1 bal 3. sor) → Sonoff buzzer vezérlőbemenete (korábban a nem használt relay2).
  # Egyszerű be/ki jel, aktív HIGH – a panelen ellenőrizve (2026-10-25: a „Buzzer próba”
  # rövid csippanást ad, nyugalomban csendes). Hangfrekvencia (PWM) nem kell.
  - platform: gpio
    id: buzzer
    name: Buzzer
    icon: mdi:bullhorn
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO2
      inverted: false
  # Gyerekzár: bekapcsolva csak a Lámpa és a Spot oldal érhető el a kijelzőn
  - platform: template
    id: child_lock
    name: Gyerekzár
    icon: mdi:lock
    optimistic: true
    lambda: "return id(locked);"
    turn_on_action:
      - globals.set: { id: locked, value: "true" }
      - script.execute: apply_lock
    turn_off_action:
      - globals.set: { id: locked, value: "false" }
      - script.execute: apply_lock
  # Éjszakai mód: a kijelző sötét, érintésre 10 mp-re felkapcsol
  - platform: template
    id: night_mode
    name: Éjszakai mód
    icon: mdi:weather-night
    optimistic: true
    lambda: "return id(night);"
    turn_on_action:
      - globals.set: { id: night, value: "true" }
      - script.execute: apply_night
    turn_off_action:
      - globals.set: { id: night, value: "false" }
      - script.execute: apply_night
  # Nem használt relé: kikapcsolt, belső állapotban tartjuk
  - platform: gpio
    id: relay3
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO1
      inverted: true

# Kézi működési próba HA-ból: a buzzer 300 ms-ig kap jelet. Automatikusan nem fut.
button:
  - platform: template
    id: buzzer_test
    name: Buzzer próba
    entity_category: diagnostic
    on_press:
      - switch.turn_on: buzzer
      - delay: 300ms
      - switch.turn_off: buzzer

light:
  - platform: binary
    id: lamp
    name: Lámpa
    output: relay1_out
    # Üzembe helyezés alatt mindig kikapcsolva indul (korábban RESTORE_DEFAULT_OFF)
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lvgl.widget.update:
          id: lamp_btn
          state:
            checked: true
    on_turn_off:
      - lvgl.widget.update:
          id: lamp_btn
          state:
            checked: false
  - platform: monochromatic
    id: display_backlight
    name: Háttérvilágítás
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 1s

# ---------------------------------------------------------------- Kijelző
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl:
    number: 45
    ignore_strapping_warning: true

display:
  - platform: st7701s
    id: tft_display
    dimensions:
      width: 480
      height: 480
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: false
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10] # CMD2_BKSEL_BK0
      - [0xCD, 0x00] # MDT flag tiltása
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display
    on_touch:
      - light.turn_on:
          id: display_backlight
          brightness: 100%

# Magyar ékezetek (ő, ű) miatt saját betűkészlet kell
font:
  - file: "gfonts://Roboto"
    id: font_s
    size: 20
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto"
    id: font_m
    size: 26
    glyphsets: [GF_Latin_Core]
  - file:
      type: gfonts
      family: Roboto
      weight: bold
    id: font_l
    size: 34
    glyphsets: [GF_Latin_Core]
  # Ikonok a Zsebpénz oldalhoz (Material Design Icons): csillag
  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: icon_nav
    size: 34
    glyphs: ["\U000F04CE"]
  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: icon_star
    size: 44
    glyphs: ["\U000F04CE"]

# A gyerekek fotója a Zsebpénz oldalon (átlátszó hátterű PNG a YAML mellett)
image:
  - file: boti_szoba_panel_boti.png
    id: img_kid1
    type: RGB565
    transparency: alpha_channel
    resize: 86x86
  - file: boti_szoba_panel_marci.png
    id: img_kid2
    type: RGB565
    transparency: alpha_channel
    resize: 86x86

# ---------------------------------------------------------------- HA-adatok
text_sensor:
  - platform: homeassistant
    id: ma_state
    entity_id: ${ma_player}
    on_value:
      - lvgl.label.update:
          id: play_icon
          text: !lambda 'return std::string(x == "playing" ? LV_SYMBOL_PAUSE : LV_SYMBOL_PLAY);'
  - platform: homeassistant
    id: ma_title
    entity_id: ${ma_player}
    attribute: media_title
    on_value:
      - lvgl.label.update:
          id: now_title
          text: !lambda "return x;"
  - platform: homeassistant
    id: ma_artist
    entity_id: ${ma_player}
    attribute: media_artist
    on_value:
      - lvgl.label.update:
          id: now_artist
          text: !lambda "return x;"
  # A spot aktuális színe, pl. "(30.0, 50.0)" – a színkör jelölőjéhez
  - platform: homeassistant
    id: spot_hs_state
    entity_id: ${spot_light}
    attribute: hs_color
    on_value:
      - lambda: |-
          float h, s;
          if (x.size() > 2 && sscanf(x.c_str() + 1, "%f, %f", &h, &s) == 2)
            spot_picker::set_hs(h, s);
          else
            spot_picker::set_hs(NAN, NAN);

sensor:
  - platform: homeassistant
    id: ma_volume
    entity_id: ${ma_player}
    attribute: volume_level
    on_value:
      - lvgl.slider.update:
          id: vol_slider
          # A csúszka teljes hossza 0–10% hangerő
          value: !lambda "return std::min(x * 1000.0f, 100.0f);"
  - platform: homeassistant
    id: spot_brightness
    entity_id: ${spot_light}
    attribute: brightness
    on_value:
      - lvgl.slider.update:
          id: spot_bri_slider
          value: !lambda "return std::isnan(x) ? 1.0f : x / 2.55f;"
  # Zsebpénz: gyűjtött összeg és a cél ára gyerekenként
  - platform: homeassistant
    id: kid1_saved
    entity_id: ${kid1_saved}
    on_value:
      - lambda: "savings::set_saved(0, x);"
  - platform: homeassistant
    id: kid1_target
    entity_id: ${kid1_target}
    on_value:
      - lambda: "savings::set_target(0, x);"
  - platform: homeassistant
    id: kid2_saved
    entity_id: ${kid2_saved}
    on_value:
      - lambda: "savings::set_saved(1, x);"
  - platform: homeassistant
    id: kid2_target
    entity_id: ${kid2_target}
    on_value:
      - lambda: "savings::set_target(1, x);"

binary_sensor:
  - platform: homeassistant
    id: spot_on
    entity_id: ${spot_light}
    on_state:
      - lvgl.widget.update:
          id: spot_btn
          state:
            checked: !lambda "return x;"
      - lvgl.widget.update:
          id: spot_power_btn
          state:
            checked: !lambda "return x;"
      - lvgl.label.update:
          id: spot_title
          text: !lambda 'return std::string(x ? "Spot – Be" : "Spot – Ki");'

# ---------------------------------------------------------------- Lejátszási listák
globals:
  - id: night
    type: bool
    restore_value: true
    initial_value: "false"
  - id: locked
    type: bool
    restore_value: true
    initial_value: "false"
  # Időzítő: hátralévő és teljes idő másodpercben (0 = nem fut)
  - id: timer_left
    type: int
    initial_value: "0"
  - id: timer_total
    type: int
    initial_value: "0"
  - id: result_uris
    type: std::vector<std::string>

script:
  # Éjszakai mód be: kijelző ki; az első érintés felkapcsolja és a gombot is megnyomja
  # Éjszakai mód ki: kijelző teljes fényerőn
  - id: apply_night
    then:
      - if:
          condition:
            lambda: "return id(night);"
          then:
            - script.execute: screen_off
          else:
            - light.turn_on:
                id: display_backlight
                brightness: 100%
  - id: screen_off
    then:
      - light.turn_off:
          id: display_backlight
          transition_length: 500ms

  # Csipogás a buzzeren: count-szor on_ms ideig szól, off_ms szünettel
  - id: beep
    mode: restart
    parameters:
      count: int
      on_ms: int
      off_ms: int
    then:
      - repeat:
          count: !lambda "return count;"
          then:
            - switch.turn_on: buzzer
            - delay: !lambda "return on_ms;"
            - switch.turn_off: buzzer
            - delay: !lambda "return off_ms;"

  # Gyerekzár: csak a Lámpa gomb marad a navigációs sávon
  - id: apply_lock
    then:
      - if:
          condition:
            lambda: "return id(locked);"
          then:
            - lvgl.widget.hide: [nav_music, nav_lists, nav_timer, nav_games, nav_savings]
            - lvgl.widget.show: lock_label
            - lvgl.page.show: page_light
          else:
            - lvgl.widget.show: [nav_music, nav_lists, nav_timer, nav_games, nav_savings]
            - lvgl.widget.hide: lock_label

  # Időzítő
  - id: timer_start
    mode: restart
    parameters:
      minutes: int
    then:
      - script.stop: timer_done
      - switch.turn_off: buzzer
      - lambda: |-
          id(timer_total) = minutes * 60;
          id(timer_left) = minutes * 60;
      - lvgl.label.update:
          id: timer_status
          text: "Fut az időzítő"
      - script.execute: timer_refresh
  - id: timer_stop
    then:
      - script.stop: timer_done
      - switch.turn_off: buzzer
      - lambda: |-
          id(timer_total) = 0;
          id(timer_left) = 0;
      - lvgl.label.update:
          id: timer_status
          text: "Válassz időt!"
      - script.execute: timer_refresh
  # Kijelzés: óra az oldalon, ív, és a hátralévő idő a navigációs gombon
  - id: timer_refresh
    then:
      - lambda: |-
          int left = id(timer_left);
          int total = id(timer_total);
          char buf[8];
          snprintf(buf, sizeof(buf), "%02d:%02d", left / 60, left % 60);
          lv_label_set_text(id(timer_lbl), buf);
          lv_label_set_text(id(nav_timer_lbl), left > 0 ? buf : "Időzítő");
          lv_arc_set_value(id(timer_arc), total > 0 ? left * 100 / total : 0);
  # Lejárt: felkapcsolja a kijelzőt és csipog párat
  - id: timer_done
    mode: restart
    then:
      - lvgl.label.update:
          id: timer_status
          text: "Lejárt az idő!"
      # Érintés nélküli ébresztés: innen indul az éjszakai 10 mp
      - lambda: "lv_display_trigger_activity(nullptr);"
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - repeat:
          count: 4
          then:
            - switch.turn_on: buzzer
            - delay: 150ms
            - switch.turn_off: buzzer
            - delay: 150ms

  # Színkörről választott szín
  - id: spot_hs
    mode: restart
    parameters:
      h: float
      s: float
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: ${spot_light}
          data_template:
            hs_color: "{{ [h | float, s | float] }}"
          variables:
            h: !lambda "return to_string((int) h);"
            s: !lambda "return to_string((int) s);"

  # Fehér árnyalatok (Kelvin)
  - id: spot_kelvin
    mode: restart
    parameters:
      k: int
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: ${spot_light}
          data_template:
            color_temp_kelvin: "{{ k | int }}"
          variables:
            k: !lambda "return to_string(k);"

  - id: spot_color
    mode: restart
    parameters:
      r: int
      g: int
      b: int
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: ${spot_light}
          data_template:
            rgb_color: "{{ [r | int, g | int, b | int] }}"
          variables:
            r: !lambda "return to_string(r);"
            g: !lambda "return to_string(g);"
            b: !lambda "return to_string(b);"

  - id: play_style
    parameters:
      media: string
    then:
      - homeassistant.action:
          action: music_assistant.play_media
          data:
            entity_id: ${ma_player}
            media_type: playlist
            enqueue: replace
          data_template:
            media_id: "{{ media }}"
          variables:
            media: !lambda "return media;"

  # A listák oldalon kiválasztott lejátszási lista indítása az elejéről
  - id: play_list
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: "return idx < (int) id(result_uris).size();"
          then:
            - homeassistant.action:
                action: music_assistant.play_media
                data:
                  entity_id: ${ma_player}
                  media_type: playlist
                  enqueue: replace
                data_template:
                  media_id: "{{ uri }}"
                variables:
                  uri: !lambda "return id(result_uris)[idx];"
            - lvgl.page.show: page_music

  # A Music Assistantban kedvencnek jelölt lejátszási listák betöltése (max. 8)
  - id: load_lists
    mode: restart
    then:
      - lvgl.label.update:
          id: lists_status
          text: "Betöltés…"
      - homeassistant.action:
          action: music_assistant.get_library
          data:
            config_entry_id: ${ma_config_entry}
            media_type: playlist
            favorite: "true"
            order_by: name
            limit: "8"
          capture_response: true
          # A választ a HA oldalon 2 mezőre szűkítjük
          response_template: >-
            {% set ns = namespace(r=[]) %}
            {% for t in response['items'][:8] %}
            {% set ns.r = ns.r + [{'u': t.uri, 'n': t.name}] %}
            {% endfor %}
            {{ ns.r | to_json }}
          on_success:
            - lambda: |-
                JsonDocument doc;
                JsonArrayConst arr;
                JsonVariantConst r = response["response"];
                if (r.is<const char *>()) {
                  deserializeJson(doc, r.as<const char *>());
                  arr = doc.as<JsonArrayConst>();
                } else {
                  arr = r.as<JsonArrayConst>();
                }
                lv_obj_t *btns[8] = {id(list_btn_0), id(list_btn_1), id(list_btn_2), id(list_btn_3), id(list_btn_4), id(list_btn_5), id(list_btn_6), id(list_btn_7)};
                lv_obj_t *lbls[8] = {id(list_lbl_0), id(list_lbl_1), id(list_lbl_2), id(list_lbl_3), id(list_lbl_4), id(list_lbl_5), id(list_lbl_6), id(list_lbl_7)};
                id(result_uris).clear();
                for (JsonObjectConst t : arr) {
                  if (id(result_uris).size() >= 8) break;
                  size_t i = id(result_uris).size();
                  id(result_uris).push_back(t["u"].as<std::string>());
                  lv_label_set_text(lbls[i], t["n"].as<std::string>().c_str());
                  lv_obj_clear_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
                }
                for (size_t i = id(result_uris).size(); i < 8; i++)
                  lv_obj_add_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
                lv_label_set_text(id(lists_status), id(result_uris).empty()
                    ? "Nincs kedvenc lista – jelölj meg egyet a Music Assistantban!"
                    : "Bökj rá egy listára!");
          on_error:
            - lvgl.label.update:
                id: lists_status
                text: "Nem sikerült betölteni a listákat"

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: "return id(timer_left) > 0;"
          then:
            - lambda: "id(timer_left)--;"
            - script.execute: timer_refresh
            - if:
                condition:
                  lambda: "return id(timer_left) == 0;"
                then:
                  - script.execute: timer_done

# ---------------------------------------------------------------- LVGL felület
lvgl:
  displays: tft_display
  touchscreens: tft_touch
  buffer_size: 25%
  on_idle:
    # Éjszakai módban az utolsó érintés után 10 mp-cel elsötétül
    - timeout: 10s
      then:
        - if:
            condition:
              lambda: "return id(night);"
            then:
              - script.execute: screen_off
    # Nappal 60 mp után halványra vált
    - timeout: 60s
      then:
        - if:
            condition:
              lambda: "return !id(night);"
            then:
              - light.turn_on:
                  id: display_backlight
                  brightness: 15%
  theme:
    button:
      bg_color: 0x2A3550
      text_color: 0xFFFFFF
      radius: 18
      border_width: 0
      shadow_width: 0
      checked:
        bg_color: 0xF5B700
        text_color: 0x1A1A1A
  style_definitions:
    - id: page_style
      bg_color: 0x121826
      text_color: 0xFFFFFF
      text_font: font_m
      pad_all: 0
      border_width: 0
    - id: nav_btn
      height: 64
      width: 84
      radius: 0
      bg_color: 0x1B2336
  top_layer:
    widgets:
      # Alsó navigációs sáv
      - obj:
          align: BOTTOM_MID
          width: 480
          height: 64
          pad_all: 0
          border_width: 0
          bg_color: 0x1B2336
          radius: 0
          widgets:
            - button:
                styles: nav_btn
                x: 0
                on_click:
                  - lvgl.page.show: page_light
                widgets:
                  - label:
                      align: CENTER
                      text: "Lámpa"
                      text_font: font_s
            - button:
                id: nav_music
                styles: nav_btn
                x: 84
                on_click:
                  - lvgl.page.show: page_music
                widgets:
                  - label:
                      align: CENTER
                      text: "Zene"
                      text_font: font_s
            - button:
                id: nav_lists
                styles: nav_btn
                x: 168
                on_click:
                  - lvgl.page.show: page_lists
                  - script.execute: load_lists
                widgets:
                  - label:
                      align: CENTER
                      text: "Listák"
                      text_font: font_s
            - button:
                id: nav_timer
                styles: nav_btn
                x: 252
                on_click:
                  - lvgl.page.show: page_timer
                widgets:
                  - label:
                      id: nav_timer_lbl
                      align: CENTER
                      text: "Időzítő"
                      text_font: font_s
            - button:
                id: nav_games
                styles: nav_btn
                x: 336
                on_click:
                  - lvgl.page.show: page_games
                widgets:
                  - label:
                      align: CENTER
                      text: "Játék"
                      text_font: font_s
            - button:
                id: nav_savings
                styles: nav_btn
                x: 420
                width: 60
                on_click:
                  - lambda: |-
                      savings::setup(0, id(sav1_stars), id(sav1_pct), id(sav1_saved), id(sav1_target));
                      savings::setup(1, id(sav2_stars), id(sav2_pct), id(sav2_saved), id(sav2_target));
                  - lvgl.page.show: page_savings
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F04CE"
                      text_font: icon_nav
