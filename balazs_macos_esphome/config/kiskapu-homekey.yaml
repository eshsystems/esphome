
esphome:
  name: homekey-reader
  friendly_name: HomeKey Reader
  on_boot:
    - lock.template.publish:
        id: homekey_lock
        state: LOCKED

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: "lRmKMF7V3Wby1egg1NMh4OSeHG/Pjm+Rweil8Yx9pqo="
  actions:
    - action: set_homekit_setup_code
      variables:
        code: string
      then:
        - lambda: 'id(homekit_bridge).set_setup_code_override(code);'
    - action: clear_homekit_setup_code
      then:
        - lambda: 'id(homekit_bridge).clear_setup_code_override();'

ota:
  - platform: esphome


wifi:
  ssid: !secret wifi_ssid_udvar
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.22.87
    gateway: 192.168.22.1
    subnet: 255.255.255.0
  ap:
    ssid: "HomeKey Reader Fallback"
    password: "12345678"

captive_portal:

web_server:
  port: 80

external_components:
  - source:
      type: git
      url: https://github.com/mefisto22/esphome-homekey-multihome
      ref: main
    components:
      - homekit
      - homekit_base
      - pn532
      - pn532_spi

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

text_sensor:
  - platform: template
    name: "PN532 utoljára olvasott tag"
    id: pn532_last_tag
    icon: "mdi:nfc"
    update_interval: never

pn532_spi:
  id: nfc_spi_module
  cs_pin: GPIO5
  update_interval: 100ms
  on_tag:
    then:
      - logger.log:
          format: "PN532 olvasott tag UID: %s"
          args: [ 'x.c_str()' ]
      - text_sensor.template.publish:
          id: pn532_last_tag
          state: !lambda 'return x;'
      - homeassistant.tag_scanned: !lambda 'return x;'

homekit_base:
  id: homekit_bridge
  setup_code: "159-35-728"

button:
  - platform: restart
    name: "Újraindítás"
  - platform: homekit
    reset_pairing_keep_homekeys:
      name: "Reset HomeKit pairing (keep HomeKeys)"
    factory_reset_homekeys:
      name: "Factory reset HomeKit + HomeKeys"

sensor:
  - platform: homekit
    homekey_homes:
      name: "HomeKey Home-ok száma"
    homekey_issuers:
      name: "HomeKey kiállítók száma"
    homekey_endpoints:
      name: "HomeKey eszközök száma"

binary_sensor:
  - platform: homekit
    homekey_provisioned:
      name: "HomeKey kiosztva"
    homekey_active_home_provisioned:
      name: "HomeKey: párosított Home kiosztva"

# Bármelyik Otthon sikeres HomeKey-e váltja a virtuális zárat.
homekit:
  lock:
    - id: homekey_lock
      nfc_id: nfc_spi_module
      on_hk_success:
        - text_sensor.template.publish:
            id: pn532_last_tag
            state: "APPLE_HOMEKEY_SUCCESS"
        - if:
            condition:
              lock.is_locked: homekey_lock
            then:
              - logger.log: "Apple HomeKey sikeres: virtuális zár nyitása"
              - lock.unlock: homekey_lock
            else:
              - logger.log: "Apple HomeKey sikeres: virtuális zár zárása"
              - lock.lock: homekey_lock
      on_hk_fail:
        - logger.log: "Apple HomeKey sikertelen"
        - text_sensor.template.publish:
            id: pn532_last_tag
            state: "APPLE_HOMEKEY_FAIL"

# A virtuális zár (Apple Otthon + Home Assistant).
lock:
  - platform: template
    id: homekey_lock
    name: "HomeKey zár"
    optimistic: true
    on_lock:
      - logger.log: "HomeKey zár: zárva"
    on_unlock:
      - logger.log: "HomeKey zár: nyitva"