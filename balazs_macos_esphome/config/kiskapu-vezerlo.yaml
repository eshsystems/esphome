# Board: ESP32E Relay X8 (ESP32-WROOM-32E)
# https://devices.esphome.io/devices/esp32e-relay-x8/
#
# LED-szalag: arduino + neopixelbus (I2S DMA).
# Oka: a klasszikus ESP32 RMT perifériája max 512 szimbólum, 60 RGBW LED-hez
# 1920 kell. A megszakításos utántöltés ezen a hardveren Interrupt WDT-t okoz.
# Az I2S metódus DMA-val dolgozik, nincs ISR-es utántöltés.

esphome:
  name: kiskapu_vezerlo
  friendly_name: Kiskapu vezérlő
  # A zár optimistic módban van, indulás után nincs ismert állapota.
  # A relé ALWAYS_OFF, tehát fizikailag zárva van - ezt publikáljuk.
  on_boot:
    priority: -100
    then:
      - lock.template.publish:
          id: kiskapu_zar
          state: LOCKED

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  encryption:
    key: "237MbSb5ITeJwjzWKJB7hZA8Gyjbp7TdqW6pyazg0w8="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid_udvar
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.22.190
    gateway: 192.168.22.1
    subnet: 255.255.255.0

  ap:
    ssid: "kiskapuvezerlo"
    password: "0f4c873EwxHU"

captive_portal:

web_server:
  port: 80

status_led:
  pin:
    number: GPIO23

# Relay 2 (GPIO33) a LED-szalag tápja.
# A power_supply garantálja a sorrendet: előbb relé, 300 ms várakozás,
# és csak utána indul a LED-adat. Triggerrel ez nem lenne garantált,
# mert az aszinkron fut.
power_supply:
  - id: ledszalag_tap_rele
    pin: GPIO33
    enable_time: 300ms
    keep_on_time: 0s

output:
  # Relay 1 - kerti lámpák
  - platform: gpio
    pin: GPIO32
    id: relay1_output

number:
  - platform: template
    name: "Mágneszár nyitási idő"
    id: magneszar_ido
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 5
    max_value: 60
    step: 1
    unit_of_measurement: "s"
    mode: box

# A visszazárást végző script. mode: restart -> ismételt nyitás
# újraindítja a visszaszámlálást, nem fut két példány egyszerre.
script:
  - id: magneszar_auto_zaras
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t)(id(magneszar_ido).state * 1000);'
      - switch.turn_off: relay3
      - lock.template.publish:
          id: kiskapu_zar
          state: LOCKED

lock:
  - platform: template
    name: "Kiskapu mágneszár"
    id: kiskapu_zar
    optimistic: true
    lock_action:
      # Kézi zárás: a függőben lévő auto-zárást is eldobjuk,
      # különben később feleslegesen belelőne.
      - script.stop: magneszar_auto_zaras
      - switch.turn_off: relay3
    unlock_action:
      - switch.turn_on: relay3
      - if:
          condition:
            switch.is_on: auto_visszazaras
          then:
            - script.execute: magneszar_auto_zaras

switch:
  # Relay 2 szándékosan nincs itt: a power_supply kezeli.

  # Relay 3 - mágneszár, csak a lock entitás használja
  - platform: gpio
    pin: GPIO25
    id: relay3
    internal: true
    restore_mode: ALWAYS_OFF

  # Relay 4
  - platform: gpio
    pin: GPIO26
    name: Relay4
    id: relay4

  # Relay 5
  - platform: gpio
    pin: GPIO27
    name: Relay5
    id: relay5

  # Relay 6
  - platform: gpio
    pin: GPIO14
    name: Relay6
    id: relay6

  # Relay 7 - GPIO12 strapping láb (MTDI). Csak indokolt esetben.
  # - platform: gpio
  #   pin:
  #     number: GPIO12
  #     ignore_strapping_warning: true
  #   name: Relay7
  #   id: relay7

  # Relay 8
  - platform: gpio
    pin: GPIO13
    name: Relay8
    id: relay8

  # Automatikus visszazárás kapcsolója. Kikapcsolva a zár nyitva marad,
  # amíg kézzel vissza nem zárod.
  - platform: template
    name: "Automatikus visszazárás"
    id: auto_visszazaras
    icon: "mdi:lock-clock"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # Ha nyitott zárnál kapcsolod ki, a folyamatban lévő
    # visszaszámlálás is álljon le.
    on_turn_off:
      - script.stop: magneszar_auto_zaras

  - platform: restart
    name: "kiskapu_vezerlo Restart"

light:
  - platform: binary
    name: "Kerti lámpák"
    id: relay1
    output: relay1_output
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: neopixelbus
    id: kiskapu_ledszalag
    name: "Kiskapu LEDszalag"
    pin: GPIO4
    num_leds: 60
    type: GRBW
    variant: SK6812
    method:
      type: esp32_i2s
      bus: 0
    power_supply: ledszalag_tap_rele
    restore_mode: ALWAYS_OFF
    # A lag ellen: átmenet és gamma-korrekció kikapcsolva.
    # Ha nincs több akadozás, a 0.5s átmenet visszatehető.
    default_transition_length: 0s
    gamma_correct: 1.0

    effects:
      - addressable_rainbow:
          name: "WLED - Rainbow"
          speed: 10
          width: 50

      - addressable_color_wipe:
          name: "WLED - Color Wipe"
          add_led_interval: 35ms
          reverse: false
          colors:
            - red: 100%
              green: 0%
              blue: 0%
              white: 0%
              num_leds: 4
            - red: 0%
              green: 100%
              blue: 0%
              white: 0%
              num_leds: 4
            - red: 0%
              green: 0%
              blue: 100%
              white: 0%
              num_leds: 4
            - red: 0%
              green: 0%
              blue: 0%
              white: 100%
              num_leds: 4

      - addressable_scan:
          name: "WLED - Scanner"
          move_interval: 40ms
          scan_width: 4

      - addressable_twinkle:
          name: "WLED - Twinkle"
          twinkle_probability: 5%
          progress_interval: 40ms

      - addressable_random_twinkle:
          name: "WLED - Random Twinkle"
          twinkle_probability: 5%
          progress_interval: 40ms

      - addressable_fireworks:
          name: "WLED - Fireworks"
          update_interval: 40ms
          spark_probability: 10%
          use_random_color: true
          fade_out_rate: 120

      - addressable_lambda:
          name: "WLED - Rainbow Chase"
          update_interval: 40ms
          lambda: |-
            static uint16_t offset = 0;

            if (initial_run) {
              offset = 0;
            }

            auto wheel = [](uint8_t pos) -> Color {
              pos = 255 - pos;

              if (pos < 85) {
                return Color(255 - pos * 3, 0, pos * 3, 0);
              }

              if (pos < 170) {
                pos -= 85;
                return Color(0, pos * 3, 255 - pos * 3, 0);
              }

              pos -= 170;
              return Color(pos * 3, 255 - pos * 3, 0, 0);
            };

            for (int i = 0; i < it.size(); i++) {
              uint8_t color_index = (i * 256 / it.size() + offset) & 255;
              it[i] = wheel(color_index);
            }

            offset += 2;

      - addressable_lambda:
          name: "WLED - White Breathe"
          update_interval: 40ms
          lambda: |-
            static uint8_t level = 10;
            static int dir = 6;

            if (initial_run) {
              level = 10;
              dir = 6;
            }

            level += dir;

            if (level >= 250) {
              level = 250;
              dir = -6;
            }

            if (level <= 10) {
              level = 10;
              dir = 6;
            }

            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(0, 0, 0, level);
            }

      - addressable_lambda:
          name: "WLED - Meteor"
          update_interval: 40ms
          lambda: |-
            static int pos = 0;

            if (initial_run) {
              pos = 0;
            }

            it.all().fade_to_black(35);

            for (int i = 0; i < 8; i++) {
              int p = pos - i;
              if (p >= 0 && p < it.size()) {
                int brightness = 255 - (i * 28);
                it[p] = Color(brightness, brightness, brightness, 0);
              }
            }

            pos++;

            if (pos >= it.size() + 8) {
              pos = 0;
            }

      - addressable_lambda:
          name: "WLED - Gate Open Green"
          update_interval: 50ms
          lambda: |-
            static int pos = 0;

            if (initial_run) {
              pos = 0;
            }

            it.all() = Color(0, 0, 0, 0);

            for (int i = 0; i < it.size(); i++) {
              if ((i + pos) % 10 < 5) {
                it[i] = Color(0, 255, 0, 0);
              }
            }

            pos++;

      - addressable_lambda:
          name: "WLED - Police"
          update_interval: 80ms
          lambda: |-
            static bool phase = false;

            if (initial_run) {
              phase = false;
            }

            for (int i = 0; i < it.size(); i++) {
              bool left_side = i < it.size() / 2;

              if ((left_side && phase) || (!left_side && !phase)) {
                it[i] = Color(255, 0, 0, 0);
              } else {
                it[i] = Color(0, 0, 255, 0);
              }
            }

            phase = !phase;

      - addressable_lambda:
          name: "WLED - Warm Sparkle"
          update_interval: 50ms
          lambda: |-
            it.all().fade_to_black(45);

            for (int i = 0; i < it.size(); i++) {
              if (random_uint32() % 100 < 8) {
                it[i] = Color(255, 120, 20, 80);
              }
            }

      - addressable_lambda:
          name: "WLED - Running Red"
          update_interval: 40ms
          lambda: |-
            static int pos = 0;

            if (initial_run) {
              pos = 0;
            }

            it.all().fade_to_black(60);

            for (int i = 0; i < it.size(); i++) {
              if ((i + pos) % 12 < 3) {
                it[i] = Color(255, 0, 0, 0);
              }
            }

            pos++;

      - addressable_lambda:
          name: "WLED - Soft RGB Fade"
          update_interval: 50ms
          lambda: |-
            static uint8_t hue = 0;

            if (initial_run) {
              hue = 0;
            }

            auto wheel = [](uint8_t pos) -> Color {
              pos = 255 - pos;

              if (pos < 85) {
                return Color(255 - pos * 3, 0, pos * 3, 0);
              }

              if (pos < 170) {
                pos -= 85;
                return Color(0, pos * 3, 255 - pos * 3, 0);
              }

              pos -= 170;
              return Color(pos * 3, 255 - pos * 3, 0, 0);
            };

            Color c = wheel(hue);

            for (int i = 0; i < it.size(); i++) {
              it[i] = c;
            }

            hue++;

binary_sensor:
  - platform: gpio
    id: kiskapu_nyitaserzekelo
    name: "Nyitásérzékelő"
    device_class: door
    pin:
      number: GPIO16
      mode:
        input: true
        pullup: true
      inverted: false
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: gpio
    id: kiskapu_lampakapcsolo
    name: "Lámpakapcsoló"
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 50ms
    # Kapcsolja a szalagot: gombnyomásra be, újabb nyomásra ki.
    on_press:
      then:
        - light.toggle: kiskapu_ledszalag